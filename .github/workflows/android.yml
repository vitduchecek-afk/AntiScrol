name: Android build

on:
  push:
    branches:
      - claude/pensive-mccarthy-f2i4hv
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Create a release with this tag (e.g. v0.1.0). Leave empty to only build.'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          # The runner image already has the SDK; only accept licences and export paths.
          # Gradle downloads the platform and build-tools it needs.
          packages: ''

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Work out the version
        id: version
        env:
          INPUT_TAG: ${{ github.event.inputs.release_tag }}
        run: |
          TAG=""
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          elif [[ "$INPUT_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            TAG="$INPUT_TAG"
          fi
          if [[ -n "$TAG" ]]; then NAME="${TAG#v}"; else NAME="0.0.${GITHUB_RUN_NUMBER}"; fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "Version $NAME, release tag '${TAG}'"

      - name: Unit tests
        run: ./gradlew --no-daemon :core:test :app:testReleaseUnitTest

      - name: Build signed APK
        run: ./gradlew --no-daemon :app:assembleRelease :app:assembleDebug -PappVersionName=${{ steps.version.outputs.name }}

      - name: Collect APK
        run: |
          cp app/build/outputs/apk/release/app-release.apk AntiScrol.apk
          cp app/build/outputs/apk/debug/app-debug.apk AntiScrol-debug.apk
          ls -l AntiScrol.apk AntiScrol-debug.apk
          APKSIGNER="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)/apksigner"
          "$APKSIGNER" verify --print-certs AntiScrol.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AntiScrol-apk
          path: AntiScrol.apk
          if-no-files-found: error

      - name: Upload debug APK (for the emulator smoke test only)
        uses: actions/upload-artifact@v4
        with:
          name: AntiScrol-debug-apk
          path: AntiScrol-debug.apk
          if-no-files-found: error
          retention-days: 3

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            core/build/reports/tests
            app/build/reports/tests
          if-no-files-found: ignore

      - name: Publish release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: AntiScrol ${{ steps.version.outputs.name }}
          body: |
            Testovací sestavení AntiScrol ${{ steps.version.outputs.name }}.

            Stáhni `AntiScrol.apk` níže a nainstaluj ho do telefonu s Androidem 8 nebo novějším.
          files: AntiScrol.apk
          fail_on_unmatched_files: true
          make_latest: true

  # Starts the app on an emulator and tries blocked navigations on the real (logged-out) site.
  # Informative: it runs after the build and does not gate the release.
  smoke:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: AntiScrol-apk

      - uses: actions/download-artifact@v4
        with:
          name: AntiScrol-debug-apk

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run the smoke test on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-snapshot-save -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/smoke-test.sh AntiScrol.apk AntiScrol-debug.apk

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-screenshots
          path: smoke-out
          if-no-files-found: ignore
          retention-days: 7
